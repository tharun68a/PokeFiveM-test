$engine: 3
$onesync: on
name: PokeFiveM Autonomous RPG Framework
version: 2.5.0
author: Pika Studio
description: Enterprise-grade standalone Pokémon RPG Framework for FiveM (Zero ESX Dependency) — Full Overextended Stack (oxmysql, ox_lib, ox_inventory, ox_target), pma-voice 3D spatial audio, bob74_ipl, scully_emotemenu, Gen 8 turn-based battle engine, 3D projectile capture physics, companion buddy AI, mounts, and 30 PC Storage Boxes.

tasks:
  # -------------------------------------------------------------------
  # 1. Database Connection via txAdmin Deployer
  # -------------------------------------------------------------------
  - action: connect_database

  # -------------------------------------------------------------------
  # 2. CFX Official Base Resources
  # -------------------------------------------------------------------
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  # -------------------------------------------------------------------
  # 3. Overextended (Ox) Core Suite (Prebuilt Official Releases)
  # -------------------------------------------------------------------
  ## oxmysql - High performance async MySQL/MariaDB driver
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]

  ## ox_lib - Core UI, radial menus, context menus, zone points & callbacks
  - action: download_file
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
    path: ./tmp/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]

  ## ox_target - Eye target raycast interaction system (Nurse Joy, Shops, Wild Pokemon)
  - action: download_file
    url: https://github.com/overextended/ox_target/releases/latest/download/ox_target.zip
    path: ./tmp/ox_target.zip
  - action: unzip
    src: ./tmp/ox_target.zip
    dest: ./resources/[ox]

  ## ox_inventory - Slot-based drag & drop inventory with weight & item metadata
  - action: download_file
    url: https://github.com/overextended/ox_inventory/releases/latest/download/ox_inventory.zip
    path: ./tmp/ox_inventory.zip
  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]

  ## Inject Native PokeFiveM Custom Bridge into ox_inventory (Zero ESX Dependency)
  - action: write_file
    file: ./resources/[ox]/ox_inventory/modules/bridge/custom/server.lua
    data: |
      local Inventory = require 'modules.inventory.server'
      local Items = require 'modules.items.server'
      local db = require 'modules.mysql.server'

      db.setup({
          user = { table = 'pokefivem_characters', col = 'citizenid' },
          vehicle = { table = 'pokefivem_vehicles', col = 'plate' },
      })

      ---@diagnostic disable-next-line: duplicate-set-field
      function server.setPlayerData(player)
          return {
              source = player.source,
              name = player.name or GetPlayerName(player.source),
              groups = player.groups or { ['trainer'] = 0 },
              sex = player.sex or 'm',
              dateofbirth = player.dateofbirth or '2000-01-01',
          }
      end

      function server.syncInventory(inv)
      end

      function server.hasLicense(inv, name)
          return true
      end

      function server.buyLicense(inv, license)
          return true, 'have_purchased'
      end

      function server.isPlayerBoss(playerId)
          return false
      end

      AddEventHandler('playerDropped', server.playerDropped)

      AddEventHandler('pokefivem:server:onPlayerLoaded', function(citizenid, playerObj)
          local src = playerObj.PlayerData.source
          local player = {
              source = src,
              identifier = citizenid,
              name = playerObj.PlayerData.name or GetPlayerName(src),
              groups = {
                  [playerObj.PlayerData.job.name or 'trainer'] = playerObj.PlayerData.job.grade or 0
              }
          }
          server.setPlayerInventory(player)
      end)

  - action: write_file
    file: ./resources/[ox]/ox_inventory/modules/bridge/custom/client.lua
    data: |
      local client = {}

      RegisterNetEvent('pokefivem:client:onPlayerLoaded', function(playerData)
          PlayerData = playerData
          LocalPlayer.state:set('isLoggedIn', true, false)
          OnPlayerData('groups', { [playerData.job.name or 'trainer'] = playerData.job.grade or 0 })
      end)

      RegisterNetEvent('pokefivem:client:onPlayerUnload', function()
          LocalPlayer.state:set('isLoggedIn', false, false)
          PlayerData = {}
      end)

      function client.hasGroup(group)
          return true
      end

      function client.setPlayerData(key, value)
          LocalPlayer.state:set(key, value, true)
      end

      return client

  # -------------------------------------------------------------------
  # 4. Audio & Proximity Voice Stack
  # -------------------------------------------------------------------
  ## pma-voice - High performance spatial 3D proximity voice communication
  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: v6.6.2
    dest: ./resources/[voice]/pma-voice

  # -------------------------------------------------------------------
  # 5. Standalone World & Roleplay Enhancements
  # -------------------------------------------------------------------
  ## bob74_ipl - Fixes map holes and enables all GTA V interiors & buildings
  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/bob74_ipl

  ## scully_emotemenu - Clean trainer animations, emotes, and posture controls
  - action: download_github
    src: https://github.com/Scullyy/scully_emotemenu
    ref: main
    dest: ./resources/[standalone]/scully_emotemenu

  # -------------------------------------------------------------------
  # 6. PokeFiveM Framework Core (Pika Studio)
  # -------------------------------------------------------------------
  - action: download_github
    src: https://github.com/tharun68a/PokeFiveM-test
    ref: main
    dest: ./resources/PokeFiveM

  # -------------------------------------------------------------------
  # 7. Clean up temporary archives
  # -------------------------------------------------------------------
  - action: remove_path
    path: ./tmp

  # -------------------------------------------------------------------
  # 8. Automated Database Schema Migration
  # -------------------------------------------------------------------
  - action: query_database
    file: ./resources/PokeFiveM/database/schema.sql

  # -------------------------------------------------------------------
  # 9. Master Server Configuration (ESX Legacy Architecture Format)
  # -------------------------------------------------------------------
  - action: write_file
    file: ./server.cfg
    data: |
      # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
      #    ___       _        ___ _           __  __                       #
      #   | _ \___ _| |_____ | __(_)_ _____  |  \/  |                      #
      #   |  _/ _ \ / / -_)  | _|| \ V / -_) | |\/| |                      #
      #   |_| \___/_\_\___|  |_| |_|\_/\___| |_|  |_|                      #
      #                                                                   #
      #   PokeFiveM Autonomous Pokémon RPG Framework                       #
      #   Developed by: Pika Studio | Zero ESX Dependency                 #
      #   GitHub: https://github.com/tharun68a/PokeFiveM-test               #
      #   Server CFG Docs: https://aka.cfx.re/server-commands             #
      # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

      ## Server Endpoints & Network Socket
      {{serverEndpoints}}

      ## License Key, Slots & Web API
      sv_licenseKey "{{svLicense}}"
      sv_maxclients {{maxClients}}
      set steam_webApiKey "none"

      ## Database Connection (oxmysql & MariaDB)
      set mysql_connection_string "{{dbConnectionString}}"
      set mysql_slow_query_warning 150
      set mysql_ui true

      ## Environment, Game Build & OneSync
      ## sv_enforceGameBuild is commented out by default so players connect instantly with 0 MB download.
      ## Uncomment below if you wish to enforce GTA DLC build 3258:
      # sv_enforceGameBuild 3258
      set resources_useSystemChat true
      set onesync on
      set gamename "gta5"
      setr sv_stateBagStrictMode false

      ## Server Listing & Portal Metadata
      ## Note: As of FXServer 2024+, project branding is managed via Cfx Portal (https://portal.cfx.re/)
      sv_hostname "PokeFiveM - Autonomous Pokémon RPG [Pika Studio]"
      sets sv_projectName "PokeFiveM Framework"
      sets sv_projectDesc "Advanced Pokémon RPG: Turn-based battles, wild spawner, 30 PC storage boxes, buddy AI & Gym Leaders!"
      sets tags "pokemon, rpg, standalone, pokefivem, pika, battles, companion, mounts, pokedex, ox_inventory, ox_target, ox_lib"
      sets locale "en-US"

      ## ===================================================================
      ## Framework & Admin Permissions (ESX Style ACE / Principals)
      ## ===================================================================
      add_principal group.admin group.user
      add_ace group.admin command allow
      add_ace group.admin command.quit deny

      ## txAdmin Master Admin Injection
      {{addPrincipalsMaster}}

      ## PokeFiveM System ACE Grants
      add_ace resource.PokeFiveM command.add_ace allow
      add_ace resource.PokeFiveM command.add_principal allow
      add_ace resource.PokeFiveM command.remove_principal allow
      add_ace resource.PokeFiveM command.stop allow

      ## Pokémon Trainer Admin Commands
      add_ace group.admin command.spawnwild allow
      add_ace group.admin command.givepokemon allow
      add_ace group.admin command.giveitem allow
      add_ace group.admin command.givemoney allow
      add_ace group.admin command.setjob allow
      add_ace group.admin command.healteam allow
      add_ace group.admin command.starter allow
      add_ace group.admin command.party allow
      add_ace group.admin command.pokedex allow
      add_ace group.admin command.pc allow
      add_ace group.admin inventory.admin allow

      ## ===================================================================
      ## pma-voice 3D Spatial Audio Configuration
      ## ===================================================================
      setr voice_useNativeAudio true
      setr voice_useSendingRangeOnly false
      setr voice_enableRadioAnim 1
      setr voice_enableUi 0
      setr voice_defaultCycle "GRAVE"
      setr voice_defaultVolume "0.3"
      setr voice_enableSubmix 1

      ## ===================================================================
      ## Overextended Suite Configuration (ox_lib, ox_inventory, ox_target)
      ## ===================================================================
      setr inventory:framework "custom"
      setr inventory:slots 50
      setr inventory:weight 30000
      setr inventory:target true
      setr ox:primaryColor "yellow"
      setr ox:primaryShade 7

      ## ===================================================================
      ## Security & Anti-Exploit Settings
      ## ===================================================================
      sv_scriptHookAllowed 0
      sv_enableNetworkedSounds false
      sv_enableNetworkedScriptEntityStates false
      sv_enableNetworkedPhoneExplosions false
      sv_filterRequestControl 2

      ## ===================================================================
      ## [1] Default CFX Resources
      ## ===================================================================
      ensure chat
      ensure spawnmanager
      ensure sessionmanager
      ensure hardcap

      ## ===================================================================
      ## [2] Overextended Suite & Database Driver
      ## ===================================================================
      ensure oxmysql
      ensure ox_lib
      ensure ox_target
      ensure ox_inventory

      ## ===================================================================
      ## [3] Audio & World Enhancements
      ## ===================================================================
      ensure pma-voice
      ensure bob74_ipl
      ensure scully_emotemenu

      ## ===================================================================
      ## [4] PokeFiveM Framework Core (Pika Studio)
      ## ===================================================================
      ensure PokeFiveM
